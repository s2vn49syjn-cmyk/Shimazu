<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>朝イチマーカー | HYPER ARROW美原</title>
<style>
  :root {
    --bg: #0e1014; --panel: #171a21; --line: #262b36;
    --ink: #e9ebef; --sub: #8b93a3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  }
  header {
    padding: 10px 14px 8px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 10px; flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 800; letter-spacing: .04em; }
  header h1 span { color: #ff2e88; }
  header .store { font-size: 11px; color: var(--sub); }
  /* 色グループ選択 */
  #groups {
    display: flex; gap: 6px; padding: 8px 12px 4px; flex-shrink: 0;
  }
  .grp {
    flex: 1; border: 2px solid transparent; border-radius: 10px;
    padding: 6px 4px; text-align: center; font-size: 12px; font-weight: 700;
    background: var(--panel); color: var(--sub); position: relative;
  }
  .grp::before {
    content: ""; display: inline-block; width: 10px; height: 10px;
    border-radius: 50%; margin-right: 4px; background: var(--c);
  }
  .grp.on { border-color: var(--c); color: var(--ink); }
  /* 優先キュー */
  #queue {
    display: flex; gap: 6px; padding: 6px 12px 8px; overflow-x: auto;
    border-bottom: 1px solid var(--line); flex-shrink: 0; min-height: 44px; align-items: center;
  }
  #queue:empty::before {
    content: "色を選んで台をタップ or 番号入力でマーク";
    color: var(--sub); font-size: 11.5px;
  }
  .chip {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    background: var(--panel); border: 1.5px solid var(--cc);
    border-radius: 999px; padding: 4px 10px 4px 4px; font-weight: 700;
  }
  .chip b {
    background: var(--cc); color: #fff; border-radius: 50%;
    width: 22px; height: 22px; display: grid; place-items: center; font-size: 12px;
  }
  .chip span { font-family: ui-monospace, monospace; font-size: 15px; }
  #wrap { flex: 1; overflow: auto; background: #23262e; touch-action: pan-x pan-y; }
  #cv { display: block; background: #fff; }
  #bar {
    display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); flex-shrink: 0; background: var(--panel);
  }
  #num {
    flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line);
    color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 16px;
    font-family: ui-monospace, monospace;
  }
  #num:focus { outline: none; border-color: #27c2a0; }
  button {
    border: none; border-radius: 10px; padding: 10px 12px; font-size: 13px;
    font-weight: 700; color: var(--ink); background: #222735;
  }
  button:active { transform: scale(.96); }
  #add { background: #27c2a0; color: #08231d; }
  #save { background: #ff2e88; color: #fff; }
  #zoomer { position: fixed; right: 10px; bottom: 84px; display: flex; flex-direction: column; gap: 6px; }
  #zoomer button {
    width: 42px; height: 42px; border-radius: 50%; font-size: 20px;
    background: rgba(23,26,33,.9); border: 1px solid var(--line);
  }
</style>
</head>
<body>
<header>
  <h1>朝イチ<span>マーカー</span></h1>
  <div class="store">HYPER ARROW美原</div>
</header>
<div id="groups"></div>
<div id="queue"></div>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="zoomer">
  <button id="zin">＋</button>
  <button id="zout">－</button>
</div>
<div id="bar">
  <input id="num" type="tel" placeholder="台番号" enterkeyhint="done">
  <button id="add">マーク</button>
  <button id="undo">戻す</button>
  <button id="clear">全消去</button>
  <button id="save">PNG</button>
</div>

const POS = ASSET.pos, IW = ASSET.w, IH = ASSET.h;
const GROUPS = [
  { id: "hon", label: "本命", c: "#ff2e88" },
  { id: "tai", label: "対抗", c: "#2e9bff" },
  { id: "osa", label: "押さえ", c: "#27c2a0" },
  { id: "ana", label: "穴", c: "#ff9f2e" },
];
let activeG = "hon";
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
cv.width = IW; cv.height = IH;
let scale = Math.max(0.6, Math.min(2, (window.innerWidth * 1.8) / IW));
let marks = [];   // [{n, g}]
const MHW = Math.round(IW / 70);

try {
  const s = localStorage.getItem('marks2_mihara');
  if (s) marks = JSON.parse(s);
  else {
    const old = localStorage.getItem('marks_mihara');
    if (old) marks = JSON.parse(old).map(n => ({ n: n, g: "hon" }));
  }
} catch(e) {}
function persist() { try { localStorage.setItem('marks2_mihara', JSON.stringify(marks)); } catch(e) {} }

function gcolor(g) { const f = GROUPS.find(x => x.id === g); return f ? f.c : "#ff2e88"; }
function grank(idx) {
  // 同じ色グループ内での順位
  const g = marks[idx].g;
  let r = 0;
  for (let i = 0; i <= idx; i++) if (marks[i].g === g) r++;
  return r;
}

const bg = new Image();
bg.onload = () => { applyScale(); redraw(); };
bg.src = 'data:image/png;base64,' + ASSET.bg;
function applyScale() { cv.style.width = (IW * scale) + 'px'; cv.style.height = (IH * scale) + 'px'; }

function redraw() {
  ctx.clearRect(0, 0, IW, IH);
  ctx.drawImage(bg, 0, 0, IW, IH);
  marks.forEach((m, i) => {
    const p = POS[m.n]; if (!p) return;
    const x = p[0] * IW, y = p[1] * IH;
    const col = gcolor(m.g);
    ctx.lineWidth = 5; ctx.strokeStyle = col;
    ctx.strokeRect(x - MHW, y - MHW, MHW * 2, MHW * 2);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x - MHW, y - MHW, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(grank(i)), x - MHW, y - MHW + 1);
  });
  renderQueue();
}

function renderGroups() {
  const el = document.getElementById('groups');
  el.innerHTML = GROUPS.map(g =>
    `<div class="grp ${g.id === activeG ? 'on' : ''}" style="--c:${g.c}" data-g="${g.id}">${g.label}</div>`
  ).join('');
  el.querySelectorAll('.grp').forEach(d =>
    d.onclick = () => { activeG = d.dataset.g; renderGroups(); });
}

function renderQueue() {
  const q = document.getElementById('queue');
  q.innerHTML = marks.map((m, i) =>
    `<div class="chip" style="--cc:${gcolor(m.g)}" data-i="${i}"><b>${grank(i)}</b><span>${m.n}</span></div>`
  ).join('');
  q.querySelectorAll('.chip').forEach(c =>
    c.onclick = () => { removeAt(parseInt(c.dataset.i)); });
}

let toastTimer = null;
function toast(msg, col) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;top:64px;left:50%;transform:translateX(-50%);color:#fff;font-weight:700;padding:8px 18px;border-radius:999px;font-size:14px;z-index:99;transition:opacity .3s;';
    document.body.appendChild(t);
  }
  t.style.background = col || '#ff2e88';
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = '0'; }, 1200);
}

function removeAt(i) {
  const m = marks[i];
  marks.splice(i, 1);
  toast(m.n + ' を解除', gcolor(m.g));
  persist(); redraw();
}

function toggle(n) {
  const i = marks.findIndex(m => m.n === n);
  if (i >= 0) { removeAt(i); return; }
  marks.push({ n: n, g: activeG });
  const g = GROUPS.find(x => x.id === activeG);
  toast(n + ' を' + g.label + 'にマーク', g.c);
  persist(); redraw();
}

let pd = null;
cv.addEventListener('pointerdown', e => { pd = [e.clientX, e.clientY]; });
cv.addEventListener('pointerup', e => {
  if (!pd) return;
  const moved = Math.hypot(e.clientX - pd[0], e.clientY - pd[1]);
  pd = null;
  if (moved > 8) return;
  const r = cv.getBoundingClientRect();
  const ix = (e.clientX - r.left) / r.width;
  const iy = (e.clientY - r.top) / r.height;
  let best = null, bd = 1e9;
  for (const [n, p] of Object.entries(POS)) {
    const d = Math.hypot((p[0] - ix) * IW, (p[1] - iy) * IH);
    if (d < bd) { bd = d; best = parseInt(n); }
  }
  if (best !== null && bd < IW / 22) toggle(best);
});

const numIn = document.getElementById('num');
function addByNum() {
  const n = parseInt(numIn.value);
  if (!n || !POS[n]) { numIn.value = ''; numIn.placeholder = 'その台番は無いで'; return; }
  toggle(n); numIn.value = ''; numIn.placeholder = '台番号';
}
document.getElementById('add').onclick = addByNum;
numIn.addEventListener('keydown', e => { if (e.key === 'Enter') { addByNum(); numIn.blur(); } });
document.getElementById('undo').onclick = () => { if (marks.length) removeAt(marks.length - 1); };
let clearArm = null;
const clearBtn = document.getElementById('clear');
clearBtn.onclick = () => {
  if (!marks.length) return;
  if (clearArm) {
    clearTimeout(clearArm); clearArm = null;
    marks = []; persist(); redraw();
    clearBtn.textContent = '全消去'; clearBtn.style.background = '';
    toast('全部消した', '#8b93a3');
  } else {
    clearBtn.textContent = 'ほんまに？'; clearBtn.style.background = '#b91c1c';
    clearArm = setTimeout(() => {
      clearArm = null;
      clearBtn.textContent = '全消去'; clearBtn.style.background = '';
    }, 2500);
  }
};
document.getElementById('zin').onclick = () => { scale = Math.min(3, scale * 1.3); applyScale(); };
document.getElementById('zout').onclick = () => { scale = Math.max(0.3, scale / 1.3); applyScale(); };
document.getElementById('save').onclick = () => {
  const a = document.createElement('a');
  const d = new Date();
  a.download = `狙い台_mihara_${d.getMonth()+1}-${d.getDate()}.png`;
  a.href = cv.toDataURL('image/png');
  a.click();
};
renderGroups();
</script>
